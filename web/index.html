<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; style-src 'self'; img-src 'self' data:; worker-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check your GEDCOM file · Ligneous</title>
<meta name="description" content="See every problem in your family tree file in plain English, with the line it's on. Your file stays on your computer.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fcfbf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1613" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/src/styles.css">
<script type="module" src="/src/main.ts"></script>
<script nomodule defer src="/nomodule.js"></script>
</head>
<body>
<header class="site">
  <p class="brand"><span class="wordmark" translate="no">ligneous</span><span class="tools">Tools</span></p>
  <nav aria-label="Ligneous">
    <a href="https://ligneous.org/">Back to Ligneous</a>
    <a href="https://github.com/lesfleursdelanuitdev/ligneous-validate">Source code</a>
  </nav>
</header>
<main>
  <section class="hero">
    <div class="intro">
      <h1>Check your GEDCOM <em>file</em></h1>
      <p class="lead">See every problem in your family tree file in plain English, with the line it's on.</p>
    </div>

    <div class="drop" id="drop">
      <svg class="drop-icon" viewBox="0 0 36 36" width="36" height="36" aria-hidden="true" focusable="false">
        <path d="M18 23V8M12 14l6-6 6 6M7 22v4.5A2.5 2.5 0 0 0 9.5 29h17a2.5 2.5 0 0 0 2.5-2.5V22"/>
      </svg>
      <button type="button" id="choose" class="primary">Choose a file</button>
      <span class="hint" aria-hidden="true">or drop it here</span>
      <input type="file" id="file" hidden>
    </div>
    <p class="privacy">Your file stays on your computer. Nothing is uploaded.</p>
    <noscript><p class="notice">This checker needs JavaScript turned on. It runs in your browser, so your file is never uploaded.</p></noscript>

    <div class="status-area" role="status" aria-live="polite">
      <p id="status"></p>
      <p id="note" hidden></p>
    </div>
    <div class="status-actions">
      <button type="button" id="stop" class="more" hidden>Stop</button>
      <button type="button" id="retry" class="more" hidden>Try again</button>
    </div>
  </section>

  <div id="report" class="report"></div>
</main>
<footer>
  <a href="https://ligneous.org/">Made by Ligneous</a>
  <span aria-hidden="true">·</span>
  <a href="https://github.com/lesfleursdelanuitdev/ligneous-validate">Source code</a>
</footer>
</body>
</html>
